<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katore Hosiery and Men's</title>
<style>
:root{--g:rgba(255,255,255,.8);--b:rgba(0,0,0,.09);--t:#1c1c1e;--a:#0a84ff}
*{box-sizing:border-box;margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
html{scroll-behavior:smooth}
body{color:var(--t);min-height:100vh;background:#eceef1}
body:before{content:"";position:fixed;inset:0;z-index:-1;transform:translateZ(0);background:linear-gradient(180deg,#ffffff 0%,#eceef1 45%,#d9dce1 100%)}
.glass{background:var(--g);border:1px solid var(--b);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:22px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
nav{position:sticky;top:12px;margin:12px auto;max-width:1000px;width:calc(100% - 24px);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:20}
nav b{font-size:1.05rem}nav a{color:#fff;text-decoration:none;margin-left:16px;font-size:.92rem;opacity:.9}
section{max-width:1000px;margin:26px auto;padding:0 12px}
.hero{padding:60px 24px;text-align:center}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-1px}
.hero p{margin-top:12px;font-size:1.1rem;opacity:.9}
h2{margin:0 0 14px 6px;font-size:1.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{overflow:hidden;position:relative;transition:transform .25s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;height:210px;object-fit:cover;display:block;background:#0003}
.card .in{padding:12px 14px 16px}
.card h3{font-size:1.05rem}.card .pr{font-weight:700;color:#7dffb3;margin:4px 0}
.card small{opacity:.85;display:block;margin-top:2px}
.pad{padding:22px}
.btn{border:1px solid var(--b);background:var(--g);color:#fff;padding:9px 16px;border-radius:14px;cursor:pointer;font-size:.9rem;}
.btn.p{background:var(--a);border-color:var(--a)}.btn.d{background:#ff453a;border-color:#ff453a}
.btn.s{padding:5px 10px;font-size:.78rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.edit [data-k]{outline:1px dashed #ffe066;outline-offset:3px;border-radius:6px;cursor:text}
.ctl{display:none}.edit .ctl{display:flex}
.bar{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);padding:10px 16px;z-index:30;gap:10px;align-items:center;font-size:.85rem}
.edit .bar{display:flex}
